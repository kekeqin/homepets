services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pickstarpet
      POSTGRES_PASSWORD: pickstarpet
      POSTGRES_DB: pickstarpet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pickstarpet:pickstarpet@db:5432/pickstarpet
    depends_on:
      - db

volumes:
  postgres_data:

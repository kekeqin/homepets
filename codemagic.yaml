workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: app

    integrations:
      # App Store Connect API key integration name in Codemagic UI (Team settings > Team integrations).
      app_store_connect: kkqin

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kkqin.pickstarpet
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        APP_BUNDLE_ID: com.kkqin.pickstarpet
        # 生产环境变量 —— 在 Codemagic UI (Workflow > Environment variables) 覆盖为真实值
        API_BASE_URL: "https://api.homepets.example.com"
        REVENUECAT_ENTITLEMENT_ID: "premium"
        # 生产构建必须为 false，强制使用真实 SDK key 而不是测试商店 key
        REVENUECAT_USE_TEST_STORE: "false"
        # 敏感变量：在 Codemagic UI 中以 Secure 方式添加以下两项，构建时自动解密注入
        #   REVENUECAT_IOS_API_KEY     (appl_ 开头)
        #   REVENUECAT_ANDROID_API_KEY (goog_ 开头)
        # 它们不在 yaml 中明文出现，脚本里通过 $VAR_NAME 引用

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - app/ios/Pods

    scripts:
      - name: Show build tool versions
        script: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          pod --version

      - name: Get Flutter packages
        script: |
          set -euo pipefail
          flutter pub get

      - name: Validate iOS project
        script: |
          set -euo pipefail
          test -f pubspec.yaml
          test -d ios
          test -d "$XCODE_WORKSPACE"
          test -f ios/Runner.xcodeproj/project.pbxproj

      - name: Analyze Flutter code
        script: |
          set -euo pipefail
          flutter analyze

      - name: Run Flutter tests
        script: |
          set -euo pipefail
          flutter test

      - name: Set up iOS code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles
          echo "=== export_options.plist ==="
          cat /Users/builder/export_options.plist 2>/dev/null || echo "(not found)"
          echo "=== Provisioning profiles on disk ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "(none)"
          echo "=== Certificates on disk ==="
          ls -la ~/Library/MobileDevice/Certificates/ 2>/dev/null || echo "(none)"

      - name: Build signed IPA
        script: |
          set -euo pipefail
          # RevenueCat API keys are set as Secure environment variables in
          # Codemagic UI. Provide empty fallback so the build doesn't fail
          # with "unbound variable" before you've configured them.
          : "${REVENUECAT_IOS_API_KEY:=}"
          : "${REVENUECAT_ANDROID_API_KEY:=}"
          flutter build ipa --release --verbose \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=REVENUECAT_IOS_API_KEY="$REVENUECAT_IOS_API_KEY" \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY" \
            --dart-define=REVENUECAT_ENTITLEMENT_ID="$REVENUECAT_ENTITLEMENT_ID" \
            --dart-define=REVENUECAT_USE_TEST_STORE="$REVENUECAT_USE_TEST_STORE" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - app/build/ios/ipa/*.ipa
      - app/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
